<!doctype html>
<!--
  A storefront with no structured markup of any kind. Layer B has to say so
  plainly rather than inventing a product out of the <h1> and the price div —
  this is the page that hands off to Selector Learning Mode.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Enamel Mug — Example Outdoors</title>
    <meta name="description" content="A 350ml enamel camping mug." />
  </head>
  <body>
    <h1 class="product-title">Enamel Mug</h1>
    <div class="price">$18.00</div>
    <img class="product-image" src="/img/mug.jpg" alt="Enamel Mug" />
    <button class="add-to-cart">Add to cart</button>
  </body>
</html>
