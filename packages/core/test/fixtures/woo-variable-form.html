<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>گردو ممتاز — آجیل دست‌ساز</title>
    <meta name="generator" content="WooCommerce 9.4.2" />

    <!--
      JSON-LD describes the parent and says nothing whatever about variations,
      which is what an SEO plugin on a variable product actually emits. It is
      here so the test proves the form fills a real gap rather than a contrived
      one: the name and description below come from this, the variations do not.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "گردو ممتاز",
        "description": "گردوی تازه، بدون پوست.",
        "url": "https://ajil.example/product/walnut/"
      }
    </script>
  </head>
  <body class="woocommerce woocommerce-page single-product">
    <nav class="woocommerce-breadcrumb"><a href="/">خانه</a> / <a href="/cat/nuts">آجیل</a> / گردو ممتاز</nav>

    <div class="product">
      <h1 class="product_title">گردو ممتاز</h1>

      <!--
        The trap this fixture exists for (CLAUDE.md §7.6). The variation JSON
        below keys its attributes by term *slug* — `500g` — while the parent's
        options are term *names* — `۵۰۰ گرم`. WooCommerce silently drops every
        variation on import unless the two match character-for-character, so the
        <select> is the translation table and has to be read first.
      -->
      <form
        class="variations_form cart"
        data-product_id="482"
        data-product_variations='[{"variation_id":483,"sku":"WAL-500","display_price":420000,"display_regular_price":460000,"attributes":{"attribute_pa_weight":"500g"},"weight":"0.5","dimensions":{"length":"20","width":"12","height":"6"},"is_in_stock":true,"max_qty":14,"image":{"src":"https://ajil.example/img/walnut-500.jpg"}},{"variation_id":484,"sku":"WAL-1000","display_price":810000,"display_regular_price":810000,"attributes":{"attribute_pa_weight":"1kg"},"weight":"1","is_in_stock":true,"max_qty":6,"image":{"src":"https://ajil.example/img/walnut-1000.jpg"}},{"variation_id":485,"sku":"WAL-2000","display_price":1580000,"display_regular_price":1580000,"attributes":{"attribute_pa_weight":"2kg"},"weight":"2","is_in_stock":false,"image":{"src":"https://ajil.example/img/walnut-2000.jpg"}}]'
      >
        <table class="variations">
          <tr>
            <th class="label"><label for="pa_weight">وزن</label></th>
            <td class="value">
              <select id="pa_weight" name="attribute_pa_weight">
                <option value="">یک گزینه را انتخاب کنید</option>
                <option value="500g">۵۰۰ گرم</option>
                <option value="1kg">۱ کیلوگرم</option>
                <option value="2kg">۲ کیلوگرم</option>
              </select>
            </td>
          </tr>
        </table>
      </form>

      <div class="woocommerce-product-details__short-description">
        <p>گردوی تازه، بدون پوست.</p>
      </div>
    </div>
  </body>
</html>
