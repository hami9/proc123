name: CI

# Pull requests only. Pushes to `main` are covered by the release workflow,
# which runs the same checks before it will tag anything — running both would
# double the work and give two answers to the same question.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # The README's phase table is generated from scripts/release/phases.json.
      # This catches the version where somebody edited the table by hand and the
      # next release silently reverts it.
      - name: Generated sections are in step
        run: npm run release:check
