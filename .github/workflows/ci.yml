name: CI

# Pull requests only. Pushes to `main` are covered by the release workflow,
# which runs the same checks before it will tag anything — running both would
# double the work and give two answers to the same question.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the other worked.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # The README's phase table is generated from scripts/release/phases.json.
      # This catches the version where somebody edited the table by hand and the
      # next release silently reverts it.
      #
      # It is also why .gitattributes pins eol=lf: this step compares the README
      # on disk against text Prettier generates, so a CRLF checkout fails it on
      # Windows for a drift that does not exist.
      - name: Generated sections are in step
        run: npm run release:check

  # Rust is a separate job rather than a step inside `npm run check`, and the
  # reasoning is worth stating because phase 15 asked the question directly.
  #
  # `npm run check` is what a contributor runs on every save. Folding the Rust
  # build into it would put a ten-minute cold `cargo build` — and a hard
  # requirement on rustup plus webkit2gtk, gtk3 and libayatana-appindicator —
  # in front of somebody fixing a typo in an exporter. Most of this repository
  # is TypeScript and most changes never touch `packages/app`.
  #
  # What phase 15 actually requires is that a Rust failure fails the run, and it
  # does: this job gates the same pull request, so a broken `packages/app`
  # blocks a merge exactly as a broken test does. The gate is the workflow, not
  # one npm script.
  app:
    name: App (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tauri's Linux build links against the system WebView. Without these the
      # failure is a screenful of pkg-config errors that reads like a Rust
      # problem and is not. Windows needs no equivalent: the runner ships MSVC,
      # and WebView2 is part of the OS.
      - name: System dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            file \
            libssl-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
          # Without this both matrix legs write to one cache key and each
          # overwrites the other's artefacts every run.
          key: ${{ matrix.os }}

      - name: Install dependencies
        run: npm ci

      # The front end has to exist before the Rust build: `tauri.conf.json`
      # points `frontendDist` at `../dist`, and its absence fails the build in a
      # way that does not obviously say so.
      - name: Build the front end
        run: npm run build -w @proc123/app

      # Formatting is a property of the text, not the platform, so one run
      # answers it. Lint and tests compile, which is exactly what differs
      # between MSVC and gcc, so those run on both.
      - name: Rust format
        if: runner.os == 'Linux'
        run: npm run rust:fmt -w @proc123/app

      - name: Rust lint
        run: npm run rust:lint -w @proc123/app

      - name: Rust tests
        run: npm run rust:test -w @proc123/app

  # Phase 18. The APK is built here rather than on a contributor's machine,
  # and not only for convenience: the Android SDK and NDK are a second
  # toolchain of several gigabytes that most changes never touch, and the
  # GitHub runner already carries both. `gen/android` is generated fresh each
  # run rather than committed (the root .gitignore covers gen/) until there is
  # something in it worth keeping by hand.
  #
  # The artefact is a *debug* APK, signed with the throwaway debug key. It
  # installs on a device with "install unknown apps" allowed, which is what
  # testing on a real phone needs; a release signing key is phase 20's
  # decision and belongs to a person, not to CI.
  android:
    name: App (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Android Gradle plugin needs 17; the runner's default may differ.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner ships the SDK and several NDKs; Tauri finds the NDK through
      # NDK_HOME and nothing sets it by default.
      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
          key: android

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        working-directory: packages/app
        run: npx tauri android init --ci

      # Launcher icons for the generated project, from the same logo the desktop
      # icons came from. Only the Android set is new; anything else this
      # rewrites lives and dies in this runner.
      - name: Android launcher icons
        working-directory: packages/app
        run: npx tauri icon ../../docs/logo.png

      # One ABI, arm64, because it is what essentially every phone sold in the
      # last several years runs. A universal APK would quadruple the build for
      # emulators and devices nobody is testing on.
      - name: Build a debug APK
        working-directory: packages/app
        run: npx tauri android build --debug --apk --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: proc123-android-debug
          path: packages/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
