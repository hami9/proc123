name: Release

on:
  push:
    branches: [main]

# A release must never be cancelled halfway: it tags, commits and publishes, and
# a half-finished one leaves the repository claiming a version that has no
# release behind it. This is the one workflow that does not cancel in progress.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  binaries:
    name: Companion binary (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the other worked.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: proc123-linux-x64
          - os: windows-latest
            artifact: proc123-win32-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24+ has `--build-sea`, which does the whole thing in one step.
          # Older Node needs postject, which is alpha and segfaults against some
          # builds — see packages/companion/scripts/package.mjs.
          node-version: 24
          cache: npm

      - run: npm ci

      # SEA injects into the running Node binary, so there is no
      # cross-compilation: each platform's executable is built on that platform.
      # That is the whole reason this job is a matrix.
      - name: Build the executable
        run: npm run build:binary -w @proc123/companion

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/companion/dist/binary/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag, changelog and GitHub Release
    needs: [check, binaries]
    runs-on: ubuntu-latest
    # Empty when every commit since the last tag was a `docs:`/`chore:` and
    # nothing was released. The installers job keys off that to skip itself.
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      # semantic-release commits the changelog and version bump, and creates
      # the release. Nothing here needs `packages: write`: every workspace is
      # private and nothing is published to npm.
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the tag history to work out the next version,
          # so a shallow clone would make every release look like the first.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Flattened into one directory, because .releaserc.json names the assets
      # by path and per-artifact subdirectories would break those paths.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Deliberately after `release` rather than beside `binaries`, and the ordering
  # is the whole point.
  #
  # `binaries` builds from the pushed commit, which still carries the *previous*
  # version — harmless for a CLI that only prints it. An installer is different:
  # Windows keys upgrade detection on the version inside the MSI, so one built
  # before the bump would tell every existing install it was already current.
  # semantic-release writes the real version during `prepare` and commits it, so
  # the tag it creates is the first tree that states it. This job checks out
  # that tag.
  #
  # A failure here leaves the release itself intact and merely un-attached,
  # which is the right way round: the tag, the changelog and the extension zips
  # have all published by the time this runs.
  installers:
    name: App installer (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The same list as ci.yml's app job. Windows needs no equivalent: the
      # runner ships MSVC and WebView2 is part of the OS.
      - name: System dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            file \
            libssl-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
          # Without this both matrix legs share one cache key and each
          # overwrites the other's artefacts every run.
          key: ${{ matrix.os }}

      - run: npm ci

      # `tauri build` runs `beforeBuildCommand`, which builds the front end, so
      # that needs no step of its own here.
      - name: Build the installer
        run: npm run app:build -w @proc123/app

      # These are unsigned. Signing needs a certificate that costs money and is
      # issued to a person, so it is the project owner's call rather than
      # something CI can arrange for itself. Windows will show SmartScreen on
      # first run until then; docs/roadmap.md's phase 20 records the decision.
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bundle=packages/app/src-tauri/target/release/bundle
          found=$(find "$bundle" -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) | sort)
          if [ -z "$found" ]; then
            echo "no installer was produced under $bundle" >&2
            find "$bundle" -type f >&2 || true
            exit 1
          fi
          echo "$found"
          echo "$found" | tr '\n' '\0' \
            | xargs -0 gh release upload "v${{ needs.release.outputs.version }}" --clobber
